<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <title>Medical Record System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="/css/bootstrap.min.css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>

    <style>
        body {
            background-color: #f5f7fb;
        }

        .app-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .app-brand {
            font-weight: 700;
            letter-spacing: .2px;
        }

        .page-shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .dashboard-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #ffffff;
            padding: 24px;
            height: 100%;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .dashboard-card h5 {
            margin-bottom: 10px;
        }

        .dashboard-card p {
            color: #6b7280;
            min-height: 48px;
        }

        .page-title {
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        .table-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
        }

        .action-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
    </style>
</head>

<nav class="navbar navbar-expand-lg navbar-light app-navbar" th:fragment="navigation">
    <div class="container">
        <a class="navbar-brand app-brand" th:href="@{/dashboard}">Medical Record System</a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavigation"
                aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavigation">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
            </ul>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="form-inline my-2 my-lg-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-outline-danger btn-sm" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="mt-5">
    <div class="text-center py-4 text-muted">
        © 2026 Medical Record System
    </div>
</footer>

</html>
