<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: navigation}"></nav>

<main class="page-shell">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="page-title">Sick Notes</h2>
        </div>

        <a class="btn btn-primary" th:href="@{/sick-notes/create-sick-note}">Add Sick Note</a>
    </div>

    <div class="table-card">
        <h4 th:if="${sickNotes == null || sickNotes.size() == 0}">There are no sick notes!</h4>

        <div class="table-responsive" th:if="${sickNotes != null && sickNotes.size() > 0}">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Issued Date</th>
                    <th>Days Count</th>
                    <th>Visit ID</th>
                    <th class="text-right">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="sickNote : ${sickNotes}">
                    <td th:text="${sickNote.id}"></td>
                    <td th:text="${#dates.format(sickNote.issuedDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${sickNote.daysCount}"></td>
                    <td th:text="${sickNote.visitId}"></td>
                    <td class="text-right">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{'/sick-notes/edit-sick-note/' + ${sickNote.id}}">
                            Edit
                        </a>
                        <a class="btn btn-sm btn-outline-danger"
                           th:href="@{'/sick-notes/delete/' + ${sickNote.id}}"
                           onclick="return confirm('Are you sure you want to delete this sick note?');">
                            Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a class="btn btn-secondary mt-3" th:href="@{/dashboard}">Back to Dashboard</a>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
