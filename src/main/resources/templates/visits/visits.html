<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: navigation}"></nav>

<main class="page-shell">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="page-title">Medical Visits</h2>
        </div>

        <a class="btn btn-primary" th:href="@{/visits/create-visit}">Add Visit</a>
    </div>

    <div class="table-card">
        <h4 th:if="${visits == null || visits.size() == 0}">There are no visits!</h4>

        <div class="table-responsive" th:if="${visits != null && visits.size() > 0}">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Diagnosis</th>
                    <th>Treatment</th>
                    <th>Price</th>
                    <th class="text-right">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="visit : ${visits}">
                    <td th:text="${visit.id}"></td>
                    <td th:text="${#dates.format(visit.date, 'yyyy-MM-dd')}"></td>
                    <td th:text="${visit.diagnosis}"></td>
                    <td th:text="${visit.treatment}"></td>
                    <td th:text="${visit.price}"></td>
                    <td class="text-right">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{'/visits/edit-visit/' + ${visit.id}}">
                            Edit
                        </a>
                        <a class="btn btn-sm btn-outline-danger"
                           th:href="@{'/visits/delete/' + ${visit.id}}"
                           onclick="return confirm('Are you sure you want to delete this visit?');">
                            Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a class="btn btn-secondary mt-3" th:href="@{/dashboard}">Back to Dashboard</a>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
