<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: navigation}"></nav>

<main class="page-shell">
    <div class="mb-4">
        <h2 class="page-title">Edit Visit</h2>
    </div>

    <div class="form-card">
        <form th:action="@{/visits/update/{id}(id=${visit.id})}" th:object="${visit}" method="post">
            <div class="form-group">
                <label for="date">Date</label>
                <input class="form-control" type="date" th:field="*{date}" id="date">
                <span class="text-danger" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">Date Error</span>
            </div>

            <div class="form-group">
                <label for="patientId">Patient</label>
                <select class="form-control" th:field="*{patientId}" id="patientId">
                    <option value="">Select Patient</option>
                    <option th:each="patient : ${patients}"
                            th:value="${patient.id}"
                            th:text="${patient.name + ' - ' + patient.ucn}">
                    </option>
                </select>
                <span class="text-danger" th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}">Patient Error</span>
            </div>

            <div class="form-group">
                <label for="doctorId">Doctor</label>
                <select class="form-control" th:field="*{doctorId}" id="doctorId">
                    <option value="">Select Doctor</option>
                    <option th:each="doctor : ${doctors}"
                            th:value="${doctor.id}"
                            th:text="${doctor.name + ' - ' + doctor.degree}">
                    </option>
                </select>
                <span class="text-danger" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}">Doctor Error</span>
            </div>

            <div class="form-group">
                <label for="diagnosis">Diagnosis</label>
                <input class="form-control" type="text" th:field="*{diagnosis}" placeholder="Diagnosis" id="diagnosis">
                <span class="text-danger" th:if="${#fields.hasErrors('diagnosis')}" th:errors="*{diagnosis}">Diagnosis Error</span>
            </div>

            <div class="form-group">
                <label for="treatment">Treatment</label>
                <input class="form-control" type="text" th:field="*{treatment}" placeholder="Treatment" id="treatment">
                <span class="text-danger" th:if="${#fields.hasErrors('treatment')}" th:errors="*{treatment}">Treatment Error</span>
            </div>

            <div class="form-group">
                <label for="price">Price</label>
                <input class="form-control" type="number" min="0" step="0.01" th:field="*{price}" placeholder="Price" id="price">
                <span class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</span>
            </div>

            <div class="action-bar mt-4">
                <button type="submit" class="btn btn-primary">Update Visit</button>
                <a class="btn btn-secondary" th:href="@{/visits}">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
