<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: navigation}"></nav>

<main class="page-shell">
    <div class="mb-4">
        <h2 class="page-title">Edit Patient</h2>
    </div>

    <div class="form-card">
        <form th:action="@{/patients/update/{id}(id=${patient.id})}" th:object="${patient}" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input class="form-control" type="text" th:field="*{name}" placeholder="Patient full name" id="name">
                <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</span>
            </div>

            <div class="form-group">
                <label for="ucn">UCN</label>
                <input class="form-control" type="text" th:field="*{ucn}" placeholder="10 digit UCN" id="ucn">
                <span class="text-danger" th:if="${#fields.hasErrors('ucn')}" th:errors="*{ucn}">UCN Error</span>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input class="form-control" type="text" th:field="*{username}" placeholder="Example: patient_user" id="username">
                <span class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username Error</span>
            </div>

            <div class="form-group">
                <label for="gpId">General Practitioner</label>
                <select class="form-control" th:field="*{gpId}" id="gpId">
                    <option value="">Select GP Doctor</option>
                    <option th:each="doctor : ${doctors}"
                            th:value="${doctor.id}"
                            th:text="${doctor.name + ' - ' + doctor.degree}">
                    </option>
                </select>
                <span class="text-danger" th:if="${#fields.hasErrors('gpId')}" th:errors="*{gpId}">GP Error</span>
            </div>

            <div class="form-group">
                <label>Insurance Status</label>

                <div class="form-check">
                    <input class="form-check-input" type="radio" th:field="*{isInsured}" id="insuredYes" value="true">
                    <label class="form-check-label" for="insuredYes">Insured</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" th:field="*{isInsured}" id="insuredNo" value="false">
                    <label class="form-check-label" for="insuredNo">Not insured</label>
                </div>

                <span class="text-danger" th:if="${#fields.hasErrors('isInsured')}" th:errors="*{isInsured}">Insurance Error</span>
            </div>

            <div class="action-bar mt-4">
                <button type="submit" class="btn btn-primary">Update Patient</button>
                <a class="btn btn-secondary" th:href="@{/patients}">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
