<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: navigation}"></nav>

<main class="page-shell">
    <div class="mb-4">
        <h2 class="page-title">My Medical History</h2>
    </div>

    <div class="dashboard-card mb-4">
        <h5>Patient Information</h5>

        <p class="mb-1">
            <strong>Name:</strong>
            <span th:text="${patient.name}"></span>
        </p>

        <p class="mb-1">
            <strong>UCN:</strong>
            <span th:text="${patient.ucn}"></span>
        </p>

        <p class="mb-0">
            <strong>Insured:</strong>
            <span th:if="${patient.isInsured == true}" class="badge badge-success">Yes</span>
            <span th:if="${patient.isInsured == false}" class="badge badge-warning">No</span>
        </p>
    </div>

    <div class="table-card">
        <h4 th:if="${visits == null || visits.size() == 0}">You do not have any visits yet.</h4>

        <div class="table-responsive" th:if="${visits != null && visits.size() > 0}">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Doctor</th>
                    <th>Diagnosis</th>
                    <th>Treatment</th>
                    <th>Price</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="visit : ${visits}">
                    <td th:text="${#dates.format(visit.date, 'yyyy-MM-dd')}"></td>
                    <td th:text="${visit.doctor.name}"></td>
                    <td th:text="${visit.diagnosis}"></td>
                    <td th:text="${visit.treatment}"></td>
                    <td th:text="${visit.price}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a class="btn btn-secondary mt-3" th:href="@{/patient/dashboard}">Back to Dashboard</a>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
