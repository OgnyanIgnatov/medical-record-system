<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head"></head>
<body>
<h1>Medical Record</h1>
<nav th:replace="fragments :: navigation"></nav>
<h4>Edit Doctors</h4>
<div class="col-6">
    <form action="#" th:action="@{/doctors/update/{id}(id=${doctor.id})}" th:object="${doctor}" method="post">
        <div class="form-group">
            <label for="name">Name</label>
            <input class="form-control" type="text" th:field="*{name}" placeholder="Name" id="name">
            <input class="form-control" type="text" th:field="*{uid}" placeholder="UID" id="uid">
            <input class="form-control" type="text" th:field="*{degree}" placeholder="Degree" id="degree">
        </div>
        <button type="submit" class="btn btn-primary">Update Doctor</button>
    </form>
</div>
<footer th:replace="fragments :: footer"></footer>
</body>
</html>
