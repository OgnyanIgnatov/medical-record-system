<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head"></head>
<body>
<h1>Medical Record</h1>
<nav th:replace="fragments :: navigation"></nav>
<h4>Doctors:</h4>
<div class="col-6">
    <h3 th:if="${doctors == null}">There are no doctors!</h3>
    <table th:if="${doctors.size()>0}" class="table table-hover">
        <th>Name</th>
        <th>UID</th>
        <th>Degree</th>
        <th>Edit</th>
        <th>Delete</th>
        <tr th:each="doctor : ${doctors}">
            <td th:text="${doctor.name}"></td>
            <td th:text="${doctor.uid}"></td>
            <td th:text="${doctor.degree}"></td>
            <td><a class="btn btn-info" th:href="@{'/doctors/edit-doctor/'+${doctor.id}}">Edit</a></td>
            <td><a class="btn btn-danger" th:href="@{'/doctors/delete/'+${doctor.id}}">Delete</a></td>
        </tr>
    </table>
</div>
<footer th:replace="fragments :: footer"></footer>
</body>
</html>
