<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: navigation}"></nav>

<main class="page-shell">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="page-title">Doctors</h2>
        </div>

        <a class="btn btn-primary" th:href="@{/doctors/create-doctor}">Add Doctor</a>
    </div>

    <div class="table-card">
        <h4 th:if="${doctors == null || doctors.size() == 0}">There are no doctors!</h4>

        <div class="table-responsive" th:if="${doctors != null && doctors.size() > 0}">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>UID</th>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Degree</th>
                    <th class="text-right">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="doctor : ${doctors}">
                    <td th:text="${doctor.id}"></td>
                    <td th:text="${doctor.uid}"></td>
                    <td th:text="${doctor.username}"></td>
                    <td th:text="${doctor.name}"></td>
                    <td th:text="${doctor.degree}"></td>
                    <td class="text-right">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{'/doctors/edit-doctor/' + ${doctor.id}}">
                            Edit
                        </a>
                        <a class="btn btn-sm btn-outline-danger"
                           th:href="@{'/doctors/delete/' + ${doctor.id}}"
                           onclick="return confirm('Are you sure you want to delete this doctor?');">
                            Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a class="btn btn-secondary mt-3" th:href="@{/dashboard}">Back to Dashboard</a>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
