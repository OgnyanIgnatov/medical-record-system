<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head"></head>
<body>
<h1>MedicalRecord</h1>
<nav th:replace="fragments :: navigation"></nav>
<h4>Create Doctor</h4>
<div class="col-6">
    <form action="#" th:action="@{/doctors/create}" th:object="${doctor}" method="post">
        <div class="form-group">
            <label for="name">Name</label>
            <input class="form-control" type="text" th:field="*{name}" placeholder="Name" id="name">
            <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</span>
            <input class="form-control" type="text" th:field="*{uid}" placeholder="UID"
                   id="uid">
            <span class="text-danger" th:if="${#fields.hasErrors('uid')}" th:errors="*{uid}">UID Error</span>
            <input class="form-control" type="text" th:field="*{degree}" placeholder="Degree"
                   id="degree">
            <span class="text-danger" th:if="${#fields.hasErrors('degree')}" th:errors="*{degree}">Degree Error</span>
        </div>
        <button type="submit" class="btn btn-primary">Save Doctor</button>
    </form>
</div>
<footer th:replace="fragments :: footer"></footer>
</body>
</html>
