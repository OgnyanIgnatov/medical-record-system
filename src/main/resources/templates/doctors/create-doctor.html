<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: navigation}"></nav>

<main class="page-shell">
    <div class="mb-4">
        <h2 class="page-title">Create Doctor</h2>
    </div>

    <div class="form-card">
        <form th:action="@{/doctors/create}" th:object="${doctor}" method="post">
            <div class="form-group">
                <label for="uid">UID</label>
                <input class="form-control" type="text" th:field="*{uid}" placeholder="Example: abc-123456" id="uid">
                <span class="text-danger" th:if="${#fields.hasErrors('uid')}" th:errors="*{uid}">UID Error</span>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input class="form-control" type="text" th:field="*{username}" placeholder="Example: doctor_user" id="username">
                <span class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username Error</span>
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input class="form-control" type="text" th:field="*{name}" placeholder="Doctor full name" id="name">
                <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</span>
            </div>

            <div class="form-group">
                <label for="degree">Degree</label>
                <input class="form-control" type="text" th:field="*{degree}" placeholder="Example: Cardiologist" id="degree">
                <span class="text-danger" th:if="${#fields.hasErrors('degree')}" th:errors="*{degree}">Degree Error</span>
            </div>

            <div class="action-bar mt-4">
                <button type="submit" class="btn btn-primary">Save Doctor</button>
                <a class="btn btn-secondary" th:href="@{/doctors}">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
